    'Canvas: ' + W + 'x' + H + ' (devicePixelRatio ' + devicePixelRatio + '), MSAA 4x, display ~' + refHz.toFixed(0) + ' Hz, render every ' + div + ' vsync',
    'Frames: ' + bf, '',
    gs ? 'GPU frame time (timestamp queries, first pass begin -> last pass end):\n  avg ' + f2(gs.avg) + ' ms   p99 ' + f2(gs.p99) + ' ms   max ' + f2(gs.max) + ' ms   (' + gs.n + ' samples)' : 'GPU timestamps: not available on this adapter/browser',
    'Frame interval (requestAnimationFrame, presented frames):\n  avg ' + f2(ft.avg) + ' ms   p99 ' + f2(ft.p99) + ' ms   max ' + f2(ft.max) + ' ms   frames > 33.3 ms: ' + over, '',
    'Gate (GPU avg <= 16, p99 <= 20, no frame > 33 ms): ' + (gs ? (gs.avg <= 16 && gs.p99 <= 20 && ft.max <= 33.4 && gs.max <= 33.4 ? 'PASS' : 'FAIL') : 'n/a (no timestamps)')];
  const rep = $('rep'), txt = lines.join('\n'); rep.textContent = txt; rep.style.display = 'block';
  const data = { report: txt, width: W, height: H, refreshHz: refHz, div, frameIntervalsMs: Array.from(FT.subarray(0, bf)), gpuMs: gpu };
  const btn = document.createElement('button'); btn.textContent = 'Download perf JSON'; btn.onclick = () => download(new Blob([JSON.stringify(data)], { type: 'application/json' }), 'perf-report.json');
  rep.appendChild(document.createElement('br')); rep.appendChild(btn);
  window.__bench = data; document.title = 'BENCH_DONE';
}
function startRecorder() {
  const st = canvas.captureStream(60), mt = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  recorder = new MediaRecorder(st, { mimeType: mt, videoBitsPerSecond: 16e6 }); recChunks = [];
  recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => { const b = new Blob(recChunks, { type: 'video/webm' }); window.__rec = b; download(b, 'flythrough.webm'); document.title = 'REC_DONE'; };
  recorder.start(1000);
}

// ---------------------------------------------------------------- main loop
let last = 0, last0 = 0, frameN = 0, rafN = 0, div = 1, refHz = 60, riN = 0, hudAcc = 0, hudN = 0;
const RI = new Float32Array(40), PACE = Q.has('fps') ? +Q.get('fps') : -1;
function frame(ts) {
  requestAnimationFrame(frame);
  rafN++;
  if (riN < 40) { if (last0) RI[riN++] = ts - last0; last0 = ts;
    if (riN === 40) { const s = Array.from(RI).sort((a, b) => a - b); refHz = 1000 / max(s[20], 1); div = PACE < 0 ? max(1, floor(refHz / 60 + .05)) : PACE === 0 ? 1 : max(1, Math.round(refHz / PACE)); } }
  if (rafN % div) return;
  const dt = last ? min((ts - last) / 1000, .1) : 1 / 60, fint = last ? ts - last : 0; last = ts; frameN++;
  const dpr = devicePixelRatio || 1, cw = max(16, Math.round(canvas.clientWidth * dpr)), chh = max(16, Math.round(canvas.clientHeight * dpr));
  if (cw !== canvas.width || chh !== canvas.height) { canvas.width = cw; canvas.height = chh; }
  resize();
  let measuring = false;
  if (LIVE) { fly(dt); simT += dt; }
  else if (SHOT || SHOTS) { if (shotF === 0) setPose(shotIdx); simT = 20; }
  else {
    if (benchStart < 0 && frameN > 90 && riN >= 40) { benchStart = ts; if (REC) startRecorder(); }
    const bt = benchStart < 0 ? 0 : (ts - benchStart) / 1000; pathAt(bt); simT = 5 + bt;
    measuring = benchStart >= 0 && !runDone;
    if (measuring && bt >= (REC ? min(REC_S, 60) : 60)) { runDone = true; measuring = false; if (REC) recorder.stop(); else finishBench(); }
  }
  setupFrame(SHOT || SHOTS ? 1 / 30 : dt);
  const enc = device.createCommandEncoder();
  encodeFrame(enc, ctx.getCurrentTexture().createView());
  const rec = measuring && BENCH && bf < MAXF;
  if (rec && hasTS) { enc.resolveQuerySet(QS, 0, 2, qRes, 0); enc.copyBufferToBuffer(qRes, 0, benchBuf, bf * 16, 16); }
  SUBMIT[0] = enc.finish(); device.queue.submit(SUBMIT); SUBMIT[0] = null;
  if (rec) FT[bf++] = fint;
  if (AC) audioFrame(frameN);
  if (SHOT || SHOTS) {
    if (++shotF === 100) {
      if (SHOTS) { const i = shotIdx; canvas.toBlob(b => download(b, 'pose-' + (i + 1) + '.png'), 'image/png'); if (shotIdx < 5) { shotIdx++; shotF = 0; } else document.title = 'SHOTS_DONE'; }
      else document.title = 'READY';
    }
  }
  if (stats) { hudAcc += fint; if (++hudN === 30) { $('hud').textContent = (30000 / hudAcc).toFixed(1) + ' fps  ' + (hudAcc / 30).toFixed(2) + ' ms  ' + W + 'x' + H + '  vsync/' + div; hudAcc = hudN = 0; } }
}
if (LIVE) setTimeout(() => { if (!uiHidden) $('ui').style.opacity = .55; }, 9000); else $('ui').style.display = 'none';
setPose(0);
window.__ready = true;
requestAnimationFrame(frame);
})();
